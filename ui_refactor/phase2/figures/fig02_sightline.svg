<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#0b1016"/>
  <text x="50" y="42" fill="#e7eef2" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23" font-weight="700">图 2 · 南墙视线剖面（示意，x≈12m）</text>
  <text x="50" y="66" fill="#8d9caa" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12">剖面按工程常量绘制；用于判断“二层观察室”能否看见基地，不作为最终构图。单位：米。</text>

  <!-- ground -->
  <rect x="150" y="620" width="750" height="20" fill="#1a2227"/>
  <rect x="150" y="640" width="750" height="10" fill="#141b1f"/>
  <text x="160" y="666" fill="#5f7078" font-family="Segoe UI, sans-serif" font-size="10">墙外地面</text>

  <!-- base pad -->
  <rect x="450" y="613.6" width="420" height="6.4" fill="#1c3036" stroke="#59d8c8" stroke-width="1"/>
  <text x="780" y="604" fill="#59d8c8" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11">基地平台 y=0.16 · 半径 7m</text>
  <circle cx="660" cy="613.6" r="3" fill="#e7eef2"/>
  <text x="660" y="632" fill="#e7eef2" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">基地中心</text>

  <!-- wall -->
  <rect x="399" y="412" width="42" height="208" fill="#39434b" stroke="#5b6a73" stroke-width="1"/>
  <rect x="399" y="412" width="42" height="5" fill="#c74b45" opacity="0.85"/>
  <text x="420" y="400" fill="#c74b45" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11">墙顶 5.2</text>
  <line x1="465" y1="412" x2="465" y2="620" stroke="#8d9caa" stroke-width="1"/>
  <line x1="461" y1="412" x2="469" y2="412" stroke="#8d9caa" stroke-width="1"/>
  <line x1="461" y1="620" x2="469" y2="620" stroke="#8d9caa" stroke-width="1"/>
  <text x="470" y="520" fill="#8d9caa" font-family="Segoe UI, sans-serif" font-size="10">5.2m</text>

  <!-- observation room -->
  <rect x="255" y="332" width="135" height="288" fill="#111d24" stroke="#3e5963" stroke-width="1.2" opacity="0.95"/>
  <rect x="255" y="220" width="135" height="112" fill="#101820" stroke="#3e5963" stroke-width="1.2"/>
  <!-- window opening on front face -->
  <rect x="385" y="236" width="10" height="60" fill="#0b1016"/>
  <line x1="390" y1="236" x2="390" y2="296" stroke="#59d8c8" stroke-width="2"/>
  <line x1="390" y1="296" x2="390" y2="332" stroke="#3e5963" stroke-width="2"/>
  <line x1="390" y1="220" x2="390" y2="236" stroke="#3e5963" stroke-width="2"/>
  <text x="300" y="210" fill="#c8d3d8" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11">南墙外侧维护观察室（方案 O3）</text>
  <text x="300" y="226" fill="#8d9caa" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">地面 7.2 · 窗台 8.1 · 窗顶 9.6</text>
  <!-- height bracket floor -->
  <line x1="245" y1="332" x2="245" y2="620" stroke="#8d9caa" stroke-width="1"/>
  <line x1="241" y1="332" x2="249" y2="332" stroke="#8d9caa" stroke-width="1"/>
  <line x1="241" y1="620" x2="249" y2="620" stroke="#8d9caa" stroke-width="1"/>
  <text x="230" y="480" fill="#8d9caa" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="10">7.2m</text>
  <!-- room height -->
  <line x1="270" y1="332" x2="270" y2="220" stroke="#8d9caa" stroke-width="1" opacity="0.6"/>
  <text x="276" y="278" fill="#8d9caa" font-family="Segoe UI, sans-serif" font-size="10">2.8m</text>
  <!-- support below floor -->
  <text x="296" y="500" fill="#5f7078" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="9">下层维护间 / 钢架</text>
  <text x="296" y="514" fill="#5f7078" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="9">（结构示意，不可达）</text>

  <!-- camera -->
  <circle cx="315" cy="268" r="5" fill="#ffcb66" stroke="#0b1016" stroke-width="1.5"/>
  <text x="324" y="264" fill="#ffcb66" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11">相机 y=8.8</text>

  <!-- sightline to base center -->
  <line x1="315" y1="268" x2="660" y2="613.6" stroke="#59d8c8" stroke-width="2"/>
  <line x1="441" y1="394.2" x2="441" y2="412" stroke="#59d8c8" stroke-width="2" stroke-dasharray="2 2"/>
  <text x="450" y="372" fill="#59d8c8" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">墙顶净空 0.445m</text>

  <!-- sightline to near edge: blocked -->
  <line x1="315" y1="268" x2="450" y2="613.6" stroke="#ff5b5b" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="462" y="588" fill="#ff5b5b" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">基地近端被墙遮挡</text>

  <!-- candidate 2F -->
  <rect x="165" y="332" width="30" height="288" fill="#1a2227" stroke="#8d9caa" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="180" cy="332" r="4" fill="#ff8d6b"/>
  <text x="120" y="318" fill="#ff8d6b" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">候选二层 7.2</text>
  <line x1="180" y1="332" x2="660" y2="613.6" stroke="#ff8d6b" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="492" y="500" fill="#ff8d6b" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">二层视线被 5.2m 墙截断</text>

  <!-- candidate 4F -->
  <circle cx="180" cy="44" r="4" fill="#b997ff"/>
  <text x="120" y="32" fill="#b997ff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">四层 14.4</text>
  <line x1="180" y1="44" x2="660" y2="613.6" stroke="#b997ff" stroke-width="1" stroke-dasharray="2 5" opacity="0.8"/>
  <text x="560" y="342" fill="#b997ff" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">四层才可能越过（不再是“二层”）</text>

  <!-- dimensions -->
  <line x1="441" y1="655" x2="660" y2="655" stroke="#8d9caa" stroke-width="1"/>
  <line x1="441" y1="651" x2="441" y2="659" stroke="#8d9caa" stroke-width="1"/>
  <line x1="660" y1="651" x2="660" y2="659" stroke="#8d9caa" stroke-width="1"/>
  <text x="550" y="671" fill="#8d9caa" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10">墙内面到基地中心 7.3m</text>

  <!-- legend -->
  <g transform="translate(840,90)">
    <rect x="0" y="0" width="300" height="190" fill="#0f171d" stroke="#2b3b49" stroke-width="1"/>
    <text x="16" y="24" fill="#e7eef2" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700">判定</text>
    <line x1="16" y1="44" x2="44" y2="44" stroke="#59d8c8" stroke-width="2"/>
    <text x="54" y="48" fill="#8d9caa" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">O3 相机可越过墙顶</text>
    <line x1="16" y1="68" x2="44" y2="68" stroke="#ff5b5b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="54" y="72" fill="#8d9caa" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">基地近端/二层被遮挡</text>
    <line x1="16" y1="92" x2="44" y2="92" stroke="#b997ff" stroke-width="1" stroke-dasharray="2 5"/>
    <text x="54" y="96" fill="#8d9caa" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">四层视线可越过</text>
    <text x="16" y="126" fill="#c8d3d8" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11">结论</text>
    <text x="16" y="146" fill="#8d9caa" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">“高架维护楼二层”作为既定</text>
    <text x="16" y="162" fill="#8d9caa" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">地点不成立；O3 为外挂观察</text>
    <text x="16" y="178" fill="#8d9caa" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">室方案，需 blockout 复核。</text>
  </g>
</svg>
