<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1560" viewBox="0 0 1200 1560">
  <rect width="1200" height="1560" fill="#0b1016"/>
  <text x="40" y="38" fill="#e7eef2" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="23" font-weight="700">图 4 · 主菜单安全区与画幅裁切契约（提案）</text>
  <text x="40" y="62" fill="#8d9caa" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12">百分比基于 1280×720 逻辑坐标；在 16:9 / 16:10 / 21:9 下按 expand 规则换算。</text>

  <!-- 16:9 frame -->
  <rect x="40" y="90" width="1120" height="630" fill="#0e151b" stroke="#3e5963" stroke-width="2"/>
  <!-- left zone -->
  <rect x="40" y="90" width="403.2" height="630" fill="#59d8c8" opacity="0.08"/>
  <rect x="40" y="90" width="403.2" height="630" fill="none" stroke="#59d8c8" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="60" y="150" fill="#59d8c8" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700">UI-L 0–36%</text>
  <text x="60" y="170" fill="#8d9caa" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">标题 / 主行动 / 部署终端</text>
  <!-- right zone -->
  <rect x="891.2" y="90" width="268.8" height="630" fill="#ffcb66" opacity="0.07"/>
  <rect x="891.2" y="90" width="268.8" height="630" fill="none" stroke="#ffcb66" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="1080" y="150" fill="#ffcb66" text-anchor="end" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="700">UI-R 76–100%</text>
  <text x="1080" y="170" fill="#8d9caa" text-anchor="end" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">行动简报 / 状态</text>
  <!-- bottom zone -->
  <rect x="40" y="657" width="1120" height="63" fill="#b997ff" opacity="0.07"/>
  <rect x="40" y="657" width="1120" height="63" fill="none" stroke="#b997ff" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="600" y="692" fill="#b997ff" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700">UI-B 90–100% · 页脚 / 版本 / 退出</text>
  <!-- hero -->
  <rect x="443.2" y="140.4" width="448" height="516.6" fill="#e7eef2" opacity="0.035"/>
  <rect x="443.2" y="140.4" width="448" height="516.6" fill="none" stroke="#e7eef2" stroke-width="1.4"/>
  <text x="667.2" y="180" fill="#e7eef2" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="700">HERO 36–76% × 8–90%</text>
  <text x="667.2" y="202" fill="#8d9caa" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">基地 / 城市轴线 / 公园与 B1 微光 / 月亮</text>
  <text x="667.2" y="222" fill="#8d9caa" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">不得被常驻 UI 遮挡</text>
  <!-- safe lines -->
  <rect x="96" y="121.5" width="1008" height="567" fill="none" stroke="#83d66f" stroke-width="1" stroke-dasharray="3 6" opacity="0.8"/>
  <rect x="73.6" y="108.9" width="1052.8" height="592.2" fill="none" stroke="#ff8d6b" stroke-width="1" stroke-dasharray="2 6" opacity="0.6"/>
  <!-- dimension labels -->
  <text x="241" y="88" fill="#59d8c8" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10">36% · 461px</text>
  <text x="667" y="88" fill="#e7eef2" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10">40% · 512px</text>
  <text x="1026" y="88" fill="#ffcb66" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10">24% · 307px</text>
  <text x="600" y="746" fill="#8d9caa" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11">常驻 UI 只占虚线区；弹层（军械库/联机设置）可临时覆盖 HERO。</text>
  <text x="40" y="746" fill="#ff8d6b" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="9">ACTION SAFE 3% · TITLE SAFE 5%（仅用于检查文字安全）</text>

  <!-- aspect master -->
  <text x="40" y="800" fill="#e7eef2" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="700">母版 21:9 · 5120×2160 与安全裁切</text>
  <rect x="40" y="820" width="1120" height="480" fill="#0e151b" stroke="#3e5963" stroke-width="2"/>
  <!-- 16:9 -->
  <rect x="173.3" y="820" width="853.3" height="480" fill="none" stroke="#59d8c8" stroke-width="2"/>
  <text x="600" y="852" fill="#59d8c8" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12">16:9 3840×2160</text>
  <!-- 16:10 -->
  <rect x="216" y="820" width="768" height="480" fill="none" stroke="#ffcb66" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="600" y="878" fill="#ffcb66" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11">16:10 3456×2160</text>
  <!-- 4:3 -->
  <rect x="280" y="820" width="640" height="480" fill="none" stroke="#ff5b5b" stroke-width="1" stroke-dasharray="4 6" opacity="0.7"/>
  <text x="600" y="904" fill="#ff5b5b" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10">4:3 2880×2160（不在首发支持范围）</text>
  <!-- wings -->
  <text x="106" y="1070" fill="#8d9caa" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">21:9 翼区</text>
  <text x="1092" y="1070" fill="#8d9caa" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">21:9 翼区</text>

  <!-- notes below master -->
  <text x="40" y="1330" fill="#8d9caa" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11">裁切规则：Godot TextureRect 使用 KEEP_ASPECT_COVERED；16:10 取中央 3456，16:9 取中央 3840，21:9 用满 5120。</text>
  <text x="40" y="1350" fill="#8d9caa" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11">保护核心：所有叙事关键物必须落在中央 16:10 内；UI 禁区之外允许低对比、低细节的“翼区”。</text>
  <text x="40" y="1370" fill="#8d9caa" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11">4:3 若必须支持，需要单独渲染 4:3 母版，不能用同一张 21:9 强裁；此项待产品确认。</text>

  <!-- table -->
  <g transform="translate(40,1400)">
    <rect x="0" y="0" width="1120" height="120" fill="#0f171d" stroke="#2b3b49" stroke-width="1"/>
    <text x="16" y="24" fill="#e7eef2" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="700">分辨率换算（Godot expand）</text>
    <text x="16" y="48" fill="#8d9caa" font-family="Segoe UI, sans-serif" font-size="10">1280×720 → scale 1.0，逻辑 1280×720  |  1920×1080 → 1.5，1280×720  |  1920×1200 → 1.5，1280×800</text>
    <text x="16" y="68" fill="#8d9caa" font-family="Segoe UI, sans-serif" font-size="10">2560×1080 → 1.5，1706.7×720  |  2560×1440 → 2.0，1280×720  |  3440×1440 → 2.0，1720×720  |  3840×2160 → 3.0，1280×720</text>
    <text x="16" y="94" fill="#8d9caa" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="10">公式：scale = min(w/1280, h/720)；logical = (w/scale, h/scale)。UI 以逻辑坐标锚定，背景以母版 cover 裁切。</text>
  </g>
</svg>
